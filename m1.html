<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="m1.css">
    <script src="m1.js" defer></script>
    <title>Mision 1</title>
    
</head>
<body>
    <header> <h1> REPLICA </h1> </header>
    <main>
        <section class="main-content">
            <h3>Juego de escritura, donde el usuario tiene que replicar la palabra que salga. Hay que escribirla con el mismo tamaño y color.</h3>
            <p>Escribe, escoge un color y ajusta el tamaño con los botones inferiores</p>
            
        </section>
        <section>
            <article>
                <div class="divisores">
                    <button id="iniciar"> Iniciar juego </button>
                    <p id="frase"> </p>
                </div>

                
                <div class="divisores">
                    <h2>Color letra</h2>
                </div>
                <div class="botones">
                    <button id="black" data-color="rgb(0, 0, 0)">Negro</button>
                    <button id="red" data-color="rgb(255, 0, 0)">Rojo</button>
                    <button id="blue" data-color="rgb(0, 0, 255)">Azul</button>
                    <button id="green" data-color="rgb(0, 128, 0)">Verde</button>

                </div>
            </article>
            <article>
                <div class="divisores">
                    <h2>Tamaño letra</h2>
                </div>

                <div class ="botones">
                    <button data-size="16px">Pequeño</button>
                    <button data-size="24px">Mediano</button>
                    <button data-size="32px">Grande</button>
                </div>
            </article>
            
        </section>

        <section class="main-content">
            <div>
                <p>Tiempo: <span id="tiempo">50</span>s</p>
                <p>Puntos: <span id="puntos">0</span></p>   
                
            </div>

            <textarea id="texto" placeholder="Escribe aquí..."></textarea>
            

        </section>

    </main>
    
</body>
</html>
