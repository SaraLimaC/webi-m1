<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="m1.css">
    <script src="m1.js" defer></script>
    <title>Mision 1</title>
    
</head>
<body>
    <header> <h1> EDITOR </h1> </header>
    <main>
        <section class="main-content">
            <p>Escribe, escoge un color y ajusta el tamaño con los botones inferiores</p>
            
        </section>
        <section>
            <article>
                <div>
                <h2>Color letra</h2>
                </div>
                <div class="botones">
                <button id="red" > Rojo </button>
                
                <button id="blue" > Azul </button>

                <button id="green" > Verde </button>

                </div>
            </article>
            <article>
            <div>
            <h2>Tamaño letra</h2>
            </div>

            <div class ="botones">
            <button id="small" > Pequeño </button>

            <button id="medium" > Mediano </button>

            <button id="large" > Grande </button>
            </div>
            </article>
            
        </section>

        <section class="main-content">
            <div>
            <label for="texto">Mi texto:</label>
            </div>

            <textarea id="texto" placeholder="Escribe aquí..."></textarea>
            

        </section>

    </main>
    
</body>
</html>
